<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUSK PATROL — 픽셀 아트 전투기</title>
<meta name="description" content="WebGL2로 만든 480×270 픽셀 아트 전투기 게임. 360도 루프, 조종석 1인칭, 120초 드론 격추. 설치 없이 브라우저에서 바로 플레이.">
<meta property="og:type" content="website">
<meta property="og:title" content="DUSK PATROL">
<meta property="og:description" content="노을진 해안 도시 상공에서 120초간 드론 8대를 격추하세요. 키보드만으로 즐기는 픽셀 아트 플라이트 액션.">
<style>
  :root{
    --ink:#07060c;
    --panel:#12101d;
    --line:rgba(242,230,208,.14);
    --bone:#f2e6d0;
    --dim:#9d92a8;
    --amber:#ffb45c;
    --teal:#5ee0d0;
    --mono:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px}

  .sky{
    position:relative;overflow:hidden;padding:0 0 96px;
    background:linear-gradient(180deg,#100b1c 0%,#241634 40%,#5a2f45 70%,#a2554d 88%,#e48a55 100%);
  }
  .skyline{
    position:absolute;left:0;right:0;bottom:0;height:132px;pointer-events:none;
    background:
      repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,180,92,.20) 7px 8px),
      repeating-linear-gradient(0deg,transparent 0 10px,rgba(255,180,92,.13) 10px 11px),
      #0b0812;
    clip-path:polygon(0 100%,0 62%,4% 62%,4% 45%,7% 45%,7% 71%,10% 71%,10% 34%,14% 34%,14% 55%,17% 55%,17% 22%,21% 22%,21% 49%,24% 49%,24% 64%,28% 64%,28% 39%,32% 39%,32% 15%,36% 15%,36% 52%,39% 52%,39% 30%,43% 30%,43% 58%,47% 58%,47% 26%,51% 26%,51% 47%,55% 47%,55% 68%,59% 68%,59% 37%,63% 37%,63% 19%,67% 19%,67% 54%,71% 54%,71% 41%,75% 41%,75% 63%,79% 63%,79% 28%,83% 28%,83% 50%,87% 50%,87% 36%,91% 36%,91% 59%,95% 59%,95% 44%,100% 44%,100% 100%);
  }
  .wrap{width:min(1080px,calc(100% - 40px));margin:0 auto;position:relative;z-index:1}
  .kicker{font:700 11px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--amber)}
  .hero{padding:64px 0 34px;max-width:720px}
  h1{
    font:900 clamp(52px,10vw,104px)/.9 var(--mono);
    letter-spacing:-.05em;margin:20px 0 16px;
    text-shadow:3px 3px 0 rgba(228,107,79,.75),6px 6px 0 rgba(58,36,66,.75);
  }
  .lead{font-size:clamp(16px,2.2vw,20px);color:#ffe9d4;max-width:620px;margin:0 0 26px}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .btn{
    display:inline-flex;align-items:center;gap:9px;
    font:700 13px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
    padding:14px 20px;border:2px solid var(--amber);background:var(--amber);color:#1a0f14;
    text-decoration:none;box-shadow:4px 4px 0 rgba(228,107,79,.8);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(228,107,79,.8)}
  .btn.ghost{background:transparent;color:var(--bone);border-color:var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--teal);color:var(--teal)}

  .demo-block{position:relative;padding-bottom:64px}
  .demo-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  .section-label{font:700 11px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:10px}
  .live-dot{width:7px;height:7px;background:var(--teal);box-shadow:0 0 10px var(--teal)}
  .console{
    position:relative;border:1px solid rgba(255,180,92,.38);background:var(--panel);
    box-shadow:0 0 0 5px rgba(7,6,12,.9),0 26px 70px rgba(0,0,0,.55);
  }
  .console-bar{
    display:flex;align-items:center;gap:12px;padding:9px 14px;
    border-bottom:1px solid rgba(255,180,92,.22);
    background:linear-gradient(90deg,rgba(255,180,92,.1),transparent);
    font:700 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#e9c9a8;
  }
  .console-bar .spacer{flex:1}
  .fs-btn{
    border:1px solid var(--line);background:transparent;color:var(--bone);
    font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:7px 10px;cursor:pointer;
  }
  .fs-btn:hover{border-color:var(--amber);color:var(--amber)}
  .screen{position:relative;aspect-ratio:16/9;background:#07060c;overflow:hidden}
  .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#07060c}
  .demo-hint{
    padding:11px 14px;border-top:1px solid rgba(255,180,92,.22);
    color:#c9b8ae;font:500 12px/1.6 var(--mono);
  }
  kbd{
    display:inline-block;font:700 11px/1 var(--mono);
    border:1px solid rgba(242,230,208,.4);border-bottom-width:2px;
    padding:4px 6px;color:var(--bone);background:rgba(242,230,208,.06);
  }

  footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--dim);font:500 12px/1.8 var(--mono)}
  .foot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
  footer a{color:var(--amber);text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media(max-width:760px){
    .hero{padding:46px 0 28px}
    .console-bar .spacer{display:none}
    .sky{padding-bottom:78px}
    .skyline{height:96px}
  }
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>

<header class="sky">
  <div class="skyline"></div>
  <div class="wrap">
    <div class="hero">
      <div class="kicker">Pixel patrol / web arcade</div>
      <h1>DUSK<br>PATROL</h1>
      <p class="lead">노을진 해안 도시 상공에서 120초간 드론 8대를 격추하세요. 키보드만으로 바로 플레이.</p>
      <div class="actions">
        <a class="btn" href="#demo">게임 바로 플레이 <span aria-hidden="true">↓</span></a>
        <a class="btn ghost" href="https://github.com/jeiel85/dusk-patrol" target="_blank" rel="noopener">소스 코드 ↗</a>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap demo-block" id="demo">
    <div class="demo-head">
      <div class="section-label">Live demo</div>
      <button class="fs-btn" id="fullscreen" type="button">전체 화면 ⛶</button>
    </div>
    <div class="console" id="console">
      <div class="console-bar">
        <span>dusk_patrol — play in browser</span>
        <span class="spacer"></span>
        <span>WebGL2 · 480×270</span>
      </div>
      <div class="screen">
        <iframe id="game" src="game/index.html" title="DUSK PATROL 라이브 데모 — 브라우저에서 바로 플레이하는 전투기 게임" allow="fullscreen" allowfullscreen></iframe>
      </div>
      <div class="demo-hint">화면을 클릭한 뒤 <kbd>Enter</kbd> 시작 · <kbd>W</kbd><kbd>S</kbd> 기수 · <kbd>A</kbd><kbd>D</kbd> 선회 · <kbd>F</kbd> 미사일 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 시점</div>
    </div>
  </div>

</main>

<footer>
  <div class="wrap foot">
    <span>DUSK PATROL</span>
    <span><a href="https://github.com/jeiel85/dusk-patrol" target="_blank" rel="noopener">GitHub</a> · <a href="#demo">데모로 ↑</a></span>
  </div>
</footer>

<script>
  document.getElementById('fullscreen').addEventListener('click', function () {
    const box = document.getElementById('console');
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (box.requestFullscreen) box.requestFullscreen();
    document.getElementById('game').focus();
  });
</script>
</body>
</html>
